name: Lydia
description: 'Lydia is a French fintech, founded in 2013, that built one of Europe''s most popular
  mobile peer-to-peer payments apps, letting users send money, split bills, and pay merchants from their
  phone. Backed by Accel, Tencent and others, the company evolved into a full mobile banking and financial
  services provider. In 2024 it split its consumer banking product into a new brand, Sumeria (sumeria.eu),
  while the Lydia name continues for the P2P payments experience. Lydia publishes a security.txt bug-bounty
  contact but no longer exposes a public developer API or portal.'
